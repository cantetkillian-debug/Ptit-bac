<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#091852" />
  <title>P'tit Bac — Mon profil</title>
  <link rel="stylesheet" href="profile.css" />
</head>
<body>
  <main class="profile-page">
    <div class="decor decor-left">♛</div>
    <div class="decor decor-right">♛</div>
    <div class="decor diamond diamond-left"></div>
    <div class="decor diamond diamond-right"></div>

    <header class="topbar">
      <button class="icon-button back-button" type="button" aria-label="Retour" onclick="history.back()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5 8 12l7 7" />
          <path d="M8 12h11" />
        </svg>
      </button>
      <h1>Mon profil</h1>
      <div class="topbar-spacer" aria-hidden="true"></div>
    </header>

    <section class="identity">
      <div class="avatar-halo">
        <div class="avatar">
          <span class="avatar-emoji">🐙</span>
        </div>
      </div>

      <h2>Kiki</h2>
      <button class="player-id" type="button" data-copy="#729614">
        <span>#729614</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="8" y="8" width="10" height="10" rx="1.5"></rect>
          <path d="M6 15H5a1 1 0 0 1-1-1V6a2 2 0 0 1 2-2h8a1 1 0 0 1 1 1v1"></path>
        </svg>
      </button>
    </section>

    <nav class="profile-menu" aria-label="Menu du profil">
      <button class="menu-card" type="button" data-action="edit-profile">
        <span class="menu-icon image-icon">
          <img src="assets/profile-icon.png" alt="" />
        </span>
        <span class="menu-copy">
          <strong>Modifier mon profil</strong>
          <small>Pseudo et avatar</small>
        </span>
        <span class="chevron" aria-hidden="true">›</span>
      </button>

      <button class="menu-card" type="button" data-action="friends">
        <span class="menu-icon">
          <svg class="glossy-icon" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="friendsFill" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#dff8ff"/>
                <stop offset=".45" stop-color="#9dbbf9"/>
                <stop offset="1" stop-color="#7657f4"/>
              </linearGradient>
            </defs>
            <circle cx="24" cy="24" r="9" fill="url(#friendsFill)"/>
            <path d="M8 49c1.7-9 7.6-14 16-14s14.3 5 16 14" fill="url(#friendsFill)"/>
            <circle cx="43" cy="26" r="7" fill="url(#friendsFill)" opacity=".92"/>
            <path d="M36 49c1.3-7 5.8-11 12-11 4.8 0 8.5 2.3 10 6.5" fill="url(#friendsFill)" opacity=".92"/>
          </svg>
        </span>
        <span class="menu-copy">
          <strong>Mes amis</strong>
          <small>Voir et gérer mes amis</small>
        </span>
        <span class="chevron" aria-hidden="true">›</span>
      </button>

      <button class="menu-card" type="button" data-action="settings">
        <span class="menu-icon">
          <svg class="glossy-icon" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="settingsFill" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#e8fbff"/>
                <stop offset=".48" stop-color="#a9c2ff"/>
                <stop offset="1" stop-color="#7c5cff"/>
              </linearGradient>
            </defs>
            <path fill="url(#settingsFill)" d="M28 7h8l2 7a20 20 0 0 1 4 2l7-3 5 6-4 6a18 18 0 0 1 1 5l6 4-2 8-7 1a19 19 0 0 1-3 4l2 7-7 4-5-5a21 21 0 0 1-5 0l-5 5-7-4 2-7a19 19 0 0 1-3-4l-7-1-2-8 6-4a18 18 0 0 1 1-5l-4-6 5-6 7 3a20 20 0 0 1 4-2z"/>
            <circle cx="32" cy="32" r="9" fill="#1b226a"/>
            <circle cx="32" cy="32" r="5" fill="#c9d8ff"/>
          </svg>
        </span>
        <span class="menu-copy">
          <strong>Paramètres</strong>
          <small>Son, notifications, confidentialité...</small>
        </span>
        <span class="chevron" aria-hidden="true">›</span>
      </button>
    </nav>

    <button class="logout-button" type="button" data-action="logout">
      <span class="logout-icon">↪</span>
      <span>Se déconnecter</span>
    </button>

    <footer class="brand-footer">
      <div class="crown">♛</div>
      <div class="brand">P’tit Bac</div>
      <div class="beta">Version bêta</div>
    </footer>

    <div class="wave wave-1"></div>
    <div class="wave wave-2"></div>
    <div class="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="profile.js"></script>
</body>
</html>
